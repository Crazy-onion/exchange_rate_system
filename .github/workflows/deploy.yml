name: 汇率底稿自动更新

on:
  # 推送即运行：每次 git push 到默认分支都重新抓取+发布（含首次发布）
  push:
    branches: [ main, master ]
  # 定时：每天北京时间 10:30 / 12:30 / 14:30 自动更新
  # 注意：GitHub schedule 本身不可靠（会延迟数小时甚至整班丢弃），
  #       因此多设几个点位当保险；真正的可靠触发由本机哨兵(watcher)或手动 push 负责。
  schedule:
    - cron: '30 2 * * *'   # 北京 10:30
    - cron: '30 4 * * *'   # 北京 12:30
    - cron: '30 6 * * *'   # 北京 14:30
  # 手动触发：仓库 Actions 页 -> 右上角 "Run workflow"
  workflow_dispatch:
    inputs:
      reason:
        description: '手动触发原因（可选）'
        required: false
        default: '手动更新'

# 允许工作流把 dist/ 发布到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个发布，避免并发覆盖
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai   # 让抓取/生成时的时间戳为北京时间
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取汇率 + 生成 Excel 底稿 + 看板
        run: python main.py

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
